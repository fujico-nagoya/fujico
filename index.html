<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株式会社フジコー | 名古屋市の直結切替工事</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js (グラフ描画用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- React & Libraries -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.263.1"
            }
        }
    </script>
    <!-- Babel Standalone (Fixed version to prevent .targets["esmodules"] error) -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

    <style>
        html { scroll-behavior: smooth; }
        body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Calculator, CheckCircle, ArrowRight, Phone, Mail, Building2, 
            Droplets, Banknote, ShieldCheck, ChevronDown, ChevronUp, 
            BarChart3, Info, MessageCircle, ExternalLink, RefreshCw, LineChart,
            AlertTriangle, Coins, Layout
        } from 'lucide-react';

        // ==========================================
        // 工事費設定
        // ==========================================
        const COST_CONFIG = {
            BASE_FLOOR_4_UNDER: 2500000, 
            BASE_FLOOR_5: 2800000,       
            BASE_FLOOR_6: 3100000,       
            BASE_FLOOR_ADDITIONAL: 300000, 
            UNIT_PRICE: 40000,
            PUMP_COST: 1200000,
            DESIGN_BASE_FEE: 100000, 
            REMOVAL_TANK_FLAT: 350000,     
            REMOVAL_ELEVATED_FLAT: 750000, 
            FACILITY_MAINTENANCE: {
                13: 22000,
                20: 66000,
                25: 308000,
                40: 792000,
                50: 1320000,
                75: 2750000
            },
            DESIGN_CHECK: {
                13: 5000,
                20: 4800,
                25: 4800,
                40: 14500,
                50: 14500,
                75: 36000
            },
            ROAD_CONSTRUCTION: 1500000,
            ROAD_WAIVE_TANK_MAX: 10 
        };

        // --- Components ---

        const Header = () => (
            <header className="sticky top-0 z-40 bg-white shadow-md">
                <div className="container mx-auto px-4 py-3 flex justify-between items-center h-24"> 
                    {/* ロゴ画像エリア */}
                    <a href="#" className="flex items-center h-full py-1 hover:opacity-90 transition-opacity">
                        <img 
                            src="image_050524.png" 
                            alt="株式会社フジコー 名古屋市の直結切替工事" 
                            className="h-full w-auto object-contain max-h-[80px]" 
                            onError={(e) => {
                                e.target.style.display = 'none';
                                e.target.parentElement.innerHTML = '<span class="text-xl font-bold text-slate-800">株式会社フジコー</span>';
                            }} 
                        />
                    </a>

                    <nav className="hidden lg:flex gap-6 text-sm font-medium items-center">
                        <a href="#calculator" className="hover:text-blue-600 transition-colors">概算見積</a>
                        <a href="#features" className="hover:text-blue-600 transition-colors">直結化のメリット</a>
                        <a href="#flow" className="hover:text-blue-600 transition-colors">工事の流れ</a>
                        <a href="https://www.e-fujico.com/" target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 text-slate-500 hover:text-blue-600 transition-colors border-l pl-6">
                            施工事例・公式HP <ExternalLink className="h-3 w-3" />
                        </a>
                    </nav>
                    <a href="#contact" className="hidden sm:inline-flex bg-blue-600 text-white px-5 py-2 rounded-full font-bold hover:bg-blue-700 transition-colors shadow-lg hover:shadow-xl text-sm">
                        無料現地調査を依頼
                    </a>
                </div>
            </header>
        );

        const Hero = () => {
            const bgImage = "url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?q=80&w=1920&auto=format&fit=crop')";

            return (
                <section className="relative py-20 lg:py-32 overflow-hidden bg-slate-900">
                    <div 
                        className="absolute inset-0 bg-cover bg-center"
                        style={{ 
                            backgroundImage: bgImage,
                            backgroundPosition: 'center center'
                        }}
                    ></div>
                    <div className="absolute inset-0 bg-slate-900/40"></div>
                    <div className="container mx-auto px-4 relative z-10 text-center">
                        <div className="inline-block bg-white/10 backdrop-blur-sm border border-white/20 px-4 py-1.5 rounded-full text-sm font-medium mb-6 text-white">
                            マンション・ビルオーナー様・管理組合様へ
                        </div>
                        <h1 className="text-4xl md:text-5xl lg:text-6xl font-extrabold mb-6 leading-tight text-white drop-shadow-md">
                            寿命を迎えた受水槽を交換する前に。<br />
                            <span className="text-blue-400">直結給水方式</span>への変更をオススメします。
                        </h1>
                        <div className="text-lg md:text-xl max-w-3xl mx-auto mb-10 text-slate-100 drop-shadow-sm leading-relaxed">
                            <p>
                                高額な受水槽の更新費用をかけるのは、少しお待ちください。<br className="hidden md:block" />
                                直結化なら「新鮮な水」と「将来のコスト削減」が同時に手に入ります。<br className="hidden md:block" />
                                まずはWebで、現状と比較したコスト削減額を確認してみませんか？
                            </p>
                        </div>
                        <div className="flex flex-col sm:flex-row justify-center gap-4 mb-12">
                            <a href="#calculator" className="flex items-center justify-center gap-2 bg-white text-blue-900 px-8 py-4 rounded-lg font-bold text-lg hover:bg-blue-50 transition-all shadow-lg transform hover:-translate-y-1">
                                <Calculator className="h-5 w-5" />
                                今すぐ概算見積もり
                            </a>
                            <a href="#features" className="flex items-center justify-center gap-2 border border-white/40 text-white px-8 py-4 rounded-lg font-bold text-lg hover:bg-white/10 hover:border-white transition-all backdrop-blur-sm">
                                詳しく見る
                            </a>
                        </div>
                        <div className="text-center">
                            <p className="text-xs mb-2 text-slate-300 opacity-80">＼ 豊富な実績はこちらから ／</p>
                            <a href="https://www.e-fujico.com/" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-slate-200 hover:text-white border-b border-white/40 hover:border-white transition-colors pb-0.5">
                                株式会社フジコー 公式ホームページで施工事例を見る <ExternalLink className="h-4 w-4" />
                            </a>
                        </div>
                    </div>
                </section>
            );
        };

        const Features = () => {
            const features = [
                {
                    icon: <ShieldCheck className="h-10 w-10 text-blue-500" />,
                    title: "衛生的で美味しい水",
                    desc: "受水槽に溜めずに水道管から直接蛇口へ水を届けるため、いつでも新鮮で安全な水を利用できます。"
                },
                {
                    icon: <Banknote className="h-10 w-10 text-blue-500" />,
                    title: "維持管理コスト削減",
                    desc: "受水槽の定期清掃、水質検査、ポンプのメンテナンス費用が不要になり、長期的なコストダウンになります。"
                },
                {
                    icon: <Building2 className="h-10 w-10 text-blue-500" />,
                    title: "空きスペースの有効活用",
                    desc: "受水槽を撤去した跡地を、駐輪場や倉庫、駐車場などとして有効活用することができます。"
                }
            ];

            return (
                <section id="features" className="py-20 bg-white">
                    <div className="container mx-auto px-4">
                        <div className="text-center mb-16">
                            <h2 className="text-3xl font-bold text-slate-900 mb-4">
                                直結給水切替のメリット
                            </h2>
                            <p className="text-slate-600">
                                今の受水槽方式にはない、多くの利点があります。
                            </p>
                        </div>
                        <div className="grid md:grid-cols-3 gap-8">
                            {features.map((f, i) => (
                                <div key={i} className="bg-slate-50 p-8 rounded-2xl border border-slate-100 hover:shadow-lg transition-shadow">
                                    <div className="bg-white p-4 rounded-xl inline-block shadow-sm mb-6">{f.icon}</div>
                                    <h3 className="text-xl font-bold mb-3 text-slate-900">
                                        {f.title}
                                    </h3>
                                    <p className="text-slate-600 leading-relaxed">
                                        {f.desc}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // --- Logic ---

        const calculateEstimateValue = (floors, units, hasTankRemoval, hasElevatedTankRemoval, currentPipeSize, tankCapacity, usePump) => {
            let basePart = 0;
            if (floors <= 4) {
                basePart = COST_CONFIG.BASE_FLOOR_4_UNDER;
            } else if (floors === 5) {
                basePart = COST_CONFIG.BASE_FLOOR_5;
            } else if (floors === 6) {
                basePart = COST_CONFIG.BASE_FLOOR_6;
            } else {
                basePart = COST_CONFIG.BASE_FLOOR_6 + (floors - 6) * COST_CONFIG.BASE_FLOOR_ADDITIONAL;
            }

            const unitCost = COST_CONFIG.UNIT_PRICE * units;
            const combinedBaseCost = basePart + unitCost;
            
            let pumpCost = 0;
            const isBooster = floors >= 6 || (floors >= 3 && usePump);
            if (isBooster) pumpCost = COST_CONFIG.PUMP_COST;

            let tankRemovalCost = hasTankRemoval ? COST_CONFIG.REMOVAL_TANK_FLAT : 0;
            let elevatedRemovalCost = hasElevatedTankRemoval ? COST_CONFIG.REMOVAL_ELEVATED_FLAT : 0;
            const removalTotal = tankRemovalCost + elevatedRemovalCost;

            const designFee = COST_CONFIG.DESIGN_BASE_FEE;
            const totalConstructionCost = combinedBaseCost + pumpCost + removalTotal + designFee;

            let newPipeSize = 40;
            if (units >= 44) newPipeSize = 75;
            else if (units >= 23) newPipeSize = 50;
            else if (units >= 4) newPipeSize = 40;
            else if (units >= 2) newPipeSize = 25;
            else newPipeSize = 20;

            const currentBasicCost = COST_CONFIG.FACILITY_MAINTENANCE[currentPipeSize] || 0;
            const newBasicCost = COST_CONFIG.FACILITY_MAINTENANCE[newPipeSize] || 0;
            
            let differenceCost = 0;
            const isPipeSizeIncreased = newPipeSize > currentPipeSize;

            if (isPipeSizeIncreased && newBasicCost > currentBasicCost) {
                differenceCost = newBasicCost - currentBasicCost;
            }

            let roadConstructionCost = 0;
            let roadCostReason = "";

            if (isPipeSizeIncreased) {
                if (tankCapacity <= COST_CONFIG.ROAD_WAIVE_TANK_MAX) {
                    roadConstructionCost = 0;
                    roadCostReason = `${COST_CONFIG.ROAD_WAIVE_TANK_MAX}t以下につき免除`;
                } else {
                    roadConstructionCost = COST_CONFIG.ROAD_CONSTRUCTION;
                    roadCostReason = `増径・${COST_CONFIG.ROAD_WAIVE_TANK_MAX}t超のため発生`;
                }
            } else {
                roadCostReason = "口径変更なしのため不要";
            }

            const designCheckFee = COST_CONFIG.DESIGN_CHECK[newPipeSize] || 0;

            return {
                total: totalConstructionCost + differenceCost + designCheckFee + roadConstructionCost,
                constructionCost: totalConstructionCost,
                combinedBaseCost,
                pumpCost,
                tankRemovalCost,
                elevatedRemovalCost,
                designFee,
                differenceCost,
                designCheckFee,
                roadConstructionCost,
                roadCostReason,
                newPipeSize,
                currentPipeSize,
                tankCapacity,
                isBooster
            };
        };

        const calculateSimulationData = (units, tankCapacity, pumpType, initialCost, compareWithRenewal, renewalYear) => {
            const scale = Math.max(0.5, units / 60);
            const baseCapacity = 5;
            const baseCleaningCost = 48000;
            const cleaningCostPerTon = 2000;
            const safeCapacity = tankCapacity || 5;
            const calcCapacity = Math.max(baseCapacity, safeCapacity);
            
            const tankCleaningYearly = (baseCleaningCost + (calcCapacity - baseCapacity) * cleaningCostPerTon) / 10000;
            const tankPumpMaintYearly = 12 * scale;
            const tankElecYearly = 20 * scale;
            const tankPumpReplaceCost = 130 * scale;
            
            // 受水槽更新費用の計算式
            const calculateRenewalCost = (capacity) => {
                if (capacity <= 10) {
                    return capacity * 60;
                } else {
                    return 600 + (capacity - 10) * 30;
                }
            };
            const tankRenewalCost = calculateRenewalCost(safeCapacity);

            const isDirect = pumpType === 'direct';
            const newPumpMaintYearly = isDirect ? 0 : 12 * scale;
            const newElecYearly = isDirect ? 0 : 15 * scale;
            const newPumpReplaceCost = isDirect ? 0 : 150 * scale;
            const constructionCostManYen = initialCost / 10000;

            const tankData = [];
            const directData = [];
            const delayedDirectData = []; 
            
            let tankSum = 0;
            let directSum = constructionCostManYen;
            let delayedSum = 0; 

            let renewalCount = 0;
            let renewalYears = [];

            // 遅延直結化の内訳計算用
            let delayedStats = {
                cleaning: 0,
                maintenance: 0,
                pumpReplace: 0,
                electricity: 0,
                tankRenewal: 0, 
                construction: constructionCostManYen 
            };

            for (let year = 0; year <= 40; year++) {
                // 1. 受水槽方式 (継続)
                if (year === 0) {
                    if (renewalYear === 0) {
                        tankSum += tankRenewalCost;
                        renewalCount++;
                        renewalYears.push(0);
                    }
                } else {
                    tankSum += (tankCleaningYearly + tankPumpMaintYearly + tankElecYearly);
                    if (year % 20 === 0) tankSum += tankPumpReplaceCost;

                    // 1回目の更新
                    if (year === renewalYear && renewalYear !== 0) {
                        tankSum += tankRenewalCost;
                        renewalCount++;
                        renewalYears.push(year);
                    }
                    // 2回目の更新 (30年後) に変更
                    if (year === renewalYear + 30) {
                        tankSum += tankRenewalCost;
                        renewalCount++;
                        renewalYears.push(year);
                    }
                }
                tankData.push(tankSum);

                // 2. 直結給水方式 (即時切り替え)
                if (year > 0) {
                    directSum += (newPumpMaintYearly + newElecYearly);
                    if (year % 20 === 0) directSum += newPumpReplaceCost;
                }
                directData.push(directSum);

                // 3. 指定年数後に直結化 (Delayed)
                if (year === 0) {
                    if (renewalYear === 0) {
                        delayedSum += constructionCostManYen;
                    }
                } else {
                    if (year < renewalYear) {
                        delayedSum += (tankCleaningYearly + tankPumpMaintYearly + tankElecYearly);
                        if (year % 20 === 0) {
                            delayedSum += tankPumpReplaceCost;
                            delayedStats.pumpReplace += tankPumpReplaceCost;
                        }
                        
                        delayedStats.cleaning += tankCleaningYearly;
                        delayedStats.maintenance += tankPumpMaintYearly;
                        delayedStats.electricity += tankElecYearly;
                    } else if (year === renewalYear) {
                        delayedSum += constructionCostManYen;
                    } else {
                        delayedSum += (newPumpMaintYearly + newElecYearly);
                        if ((year - renewalYear) % 20 === 0) {
                            delayedSum += newPumpReplaceCost;
                            delayedStats.pumpReplace += newPumpReplaceCost;
                        }
                        
                        delayedStats.maintenance += newPumpMaintYearly;
                        delayedStats.electricity += newElecYearly;
                    }
                }
                delayedDirectData.push(delayedSum);
            }

            const tankTotalCost = tankData[40];
            const newTotalCost = directData[40];
            const delayedTotalCost = delayedDirectData[40];
            const savings = tankTotalCost - newTotalCost;
            const delayedSavings = tankTotalCost - delayedTotalCost;

            return {
                tankData, directData, delayedDirectData, 
                tankTotalCost, newTotalCost, delayedTotalCost,
                savings, delayedSavings,
                tankCleaningYearly, tankPumpMaintYearly, newPumpMaintYearly,
                tankPumpReplaceCost, newPumpReplaceCost, tankElecYearly, newElecYearly,
                tankRenewalCost, constructionCostManYen,
                delayedStats,
                renewalCount, renewalYears
            };
        };

        const BreakEvenChart = ({ tankData, directData, delayedDirectData, renewalYear, compareWithRenewal }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            
            const [windowWidth, setWindowWidth] = useState(window.innerWidth);

            useEffect(() => {
                const handleResize = () => setWindowWidth(window.innerWidth);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current?.getContext('2d');
                if (!ctx) return;

                const isMobile = windowWidth < 768;
                const pointRadius = isMobile ? 0 : 3;
                const pointHoverRadius = isMobile ? 4 : 6;

                const datasets = [
                    {
                        label: '受水槽方式 (累計支出)',
                        data: tankData,
                        borderColor: '#94a3b8',
                        backgroundColor: 'rgba(148, 163, 184, 0.1)',
                        borderWidth: 2,
                        fill: false, 
                        tension: 0.1,
                        pointRadius: pointRadius, 
                        pointBackgroundColor: '#94a3b8',
                        pointHoverRadius: pointHoverRadius,
                        pointHitRadius: 10
                    }
                ];

                if (!compareWithRenewal) {
                    datasets.push({
                        label: `${renewalYear}年後に直結化 (累計支出)`,
                        data: delayedDirectData,
                        borderColor: '#2563eb', // Blue
                        backgroundColor: 'rgba(37, 99, 235, 0.05)', 
                        borderWidth: 3, 
                        fill: true, 
                        tension: 0.1,
                        pointRadius: pointRadius,
                        pointBackgroundColor: '#2563eb',
                        pointHoverRadius: pointHoverRadius,
                        pointHitRadius: 10
                    });
                }

                if (compareWithRenewal) {
                    datasets.push({
                        label: '今すぐ直結給水 (累計支出)',
                        data: directData,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.05)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.1,
                        pointRadius: pointRadius,
                        pointBackgroundColor: '#2563eb',
                        pointHoverRadius: pointHoverRadius,
                        pointHitRadius: 10
                    });
                }

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: Array.from({ length: 41 }, (_, i) => `${i}年`),
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { intersect: false, mode: 'index' },
                        plugins: {
                            legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11, weight: 'bold' } } },
                            tooltip: {
                                // スマホでもポップアップを表示するように変更
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        if (label) label += ': ';
                                        if (context.parsed.y !== null) label += Math.round(context.parsed.y).toLocaleString() + '万円';
                                        return label;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: { beginAtZero: true, title: { display: true, text: '累計支出 (万円)', font: { size: 10 } }, ticks: { font: { size: 10 } } },
                            x: { title: { display: true, text: '経過年数', font: { size: 10 } }, ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } }
                        }
                    }
                });

                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [tankData, directData, delayedDirectData, renewalYear, windowWidth, compareWithRenewal]); 

            return (
                <div className="relative h-64 md:h-80 w-full bg-white p-2 rounded-xl border border-slate-100 shadow-inner">
                    <canvas ref={chartRef}></canvas>
                </div>
            );
        };

        const InputFormSection = ({ 
            floors, setFloors, units, setUnits, useBoosterPump, setUseBoosterPump,
            currentPipeSize, setCurrentPipeSize, tankCapacity, setTankCapacity,
            hasTankRemoval, setHasTankRemoval, hasElevatedTankRemoval, setHasElevatedTankRemoval
        }) => {
            const labelClass = "block text-sm font-bold text-slate-700 mb-2 whitespace-nowrap";
            const containerClass = "flex items-center gap-2 bg-slate-50 px-3 rounded-lg border border-slate-200 h-14 w-full relative";
            const selectClass = "w-full h-full bg-transparent font-bold text-slate-700 text-lg focus:outline-none cursor-pointer appearance-none z-10";
            const chevronClass = "absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 pointer-events-none";

            return (
                <div className="space-y-6">
                     <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="relative">
                            <label className={labelClass}>建物の階数</label>
                            <div className={containerClass}>
                                <input 
                                    type="range" min="1" max="20" step="1" 
                                    value={floors} onChange={(e) => setFloors(Number(e.target.value))}
                                    className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600 mr-2"
                                />
                                <span className="text-xl font-bold text-blue-900 whitespace-nowrap">{floors}階</span>
                            </div>
                            {(floors >= 3 && floors <= 5) && (
                                <div className="absolute top-full left-0 mt-2 w-full z-20">
                                    <div className="flex items-center gap-1.5 bg-white border border-slate-200 p-2 rounded shadow-sm">
                                        <input 
                                            type="checkbox" 
                                            id="useBoosterPump" 
                                            checked={useBoosterPump} 
                                            onChange={(e) => setUseBoosterPump(e.target.checked)}
                                            className="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500"
                                        />
                                        <label htmlFor="useBoosterPump" className="text-xs text-slate-600 font-bold cursor-pointer hover:text-blue-600 transition-colors whitespace-nowrap">
                                            増圧ポンプ使用
                                        </label>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div>
                            <label className={labelClass}>総戸数</label>
                            <div className={containerClass}>
                                <select 
                                    value={units} 
                                    onChange={(e) => setUnits(Number(e.target.value))}
                                    className={selectClass}
                                >
                                    {Array.from({ length: 100 }, (_, i) => i + 1).map(num => (
                                        <option key={num} value={num}>{num}</option>
                                    ))}
                                </select>
                                <div className={chevronClass}>
                                    <div className="flex items-center gap-1">
                                        <span className="text-lg font-bold text-blue-900 mr-4">戸</span>
                                        <ChevronDown className="h-5 w-5" />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label className={labelClass}>現在の口径</label>
                            <div className={containerClass}>
                                <select 
                                    value={currentPipeSize} 
                                    onChange={(e) => setCurrentPipeSize(Number(e.target.value))}
                                    className={selectClass}
                                >
                                    {Object.keys(COST_CONFIG.FACILITY_MAINTENANCE).map(size => (

                            </div>

                            <label className={labelClass}>受水槽容量</label>

                                <select 
                                    value={tankCapacity} 
                                    onChange={(e) => setTankCapacity(Number(e.target.value))}
                                    className={selectClass}
                                >
                                    {Array.from({ length: 40 }, (_, i) => i + 1).map(num => (
                                        <option key={num} value={num}>{num}t</option>
                                    ))}
                                </select>
                                <div className={chevronClass}>
                                    <ChevronDown className="h-5 w-5" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="mt-6 pt-6 border-t border-slate-100">
                         <div className="flex flex-wrap gap-6 justify-center md:justify-start">
                            <div className="flex items-center gap-2">

                                    type="checkbox" id="tankRemoval" 
                                    checked={hasTankRemoval} onChange={(e) => setHasTankRemoval(e.target.checked)}

                                />
                                <label htmlFor="tankRemoval" className="text-sm text-slate-700 font-medium cursor-pointer">

                                </label>
                            </div>
                            <div className="flex items-center gap-2">
                                <input 
                                    type="checkbox" id="elevatedTankRemoval" 
                                    checked={hasElevatedTankRemoval} onChange={(e) => setHasElevatedTankRemoval(e.target.checked)}

                                />
                                <label htmlFor="elevatedTankRemoval" className="text-sm text-slate-700 font-medium cursor-pointer">

                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SavingsSection = ({ savings }) => {
            return (
                <div className="bg-blue-50 rounded-2xl p-6 md:p-8 text-center border-2 border-blue-600 relative overflow-hidden group w-full">

                                <span className="text-4xl md:text-6xl font-black tracking-tight text-blue-600">

                                <span className="text-2xl md:text-3xl font-bold text-blue-600">万円</span>
                            </div>
                            <div className="text-lg font-bold text-red-600 mt-2">

                        </div>
                    </div>
                </div>

        };

            const subTotalFees = result.differenceCost + result.roadConstructionCost + result.designCheckFee;

                            <div className="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900 tracking-tight mb-4 leading-tight">
                                {formatCurrency(result.total)}
                            </div>
                            <div className="text-[10px] sm:text-xs text-slate-600 bg-white p-4 rounded-xl border border-slate-200 leading-relaxed space-y-2 shadow-sm">
                                <p>
                                    <span className="font-bold text-red-600">※ご注意：</span>本シミュレーションの金額は概算です。正確な見積もりには現地調査（無料）が必要です。
                                </p>
                                <p>
                                    ※納付金等は非課税または別途規定によりますが、本シミュレーションでは便宜上合算しています。
                                </p>
                                <div>
                                    <p className="mb-1">※以下の項目は現地調査の上、別途お見積りとなるため、実際の金額が大きく変動（上振れ・下振れ）する例外ケースがございます。</p>
                                    <ul className="list-disc pl-5 space-y-1 text-slate-500">
                                        <li>屋内配管（立管など）の全面的な引き直し・更新工事（※古いマンション等で必須となる場合があります）</li>
                                        <li>長距離の道路掘削、および広範囲のアスファルト舗装復旧</li>
                                        <li>重機（クレーン等）が横付けできない場所での、特殊な受水槽・高架水槽の解体撤去</li>
                                        <li>1階テナント店舗用の特殊な配管切り替え工事</li>
                                        <li>すでに直圧化の要件を満たしており、軽微な工事で済む場合（大幅に安くなるケース）</li>
                                    </ul>
                                </div>
                            </div>
                            <div className="mt-6">
                                <a href="#contact" className="flex items-center justify-center w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-500 transition-colors shadow-lg shadow-blue-200">
                                    無料現地調査を依頼する <ArrowRight className="ml-2 h-4 w-4" />
                                </a>
                            </div>
                        </div>

                        <div className="w-full md:w-7/12 text-sm">
                            <div className="font-bold text-slate-800 border-b-2 border-slate-200 pb-2 mb-4">内訳詳細</div>
                            
                            <div className="mb-5">
                                <div className="flex justify-between items-center py-2 px-3 bg-slate-100 rounded-lg font-bold text-slate-700 mb-2">
                                    <span>直結化工事費用</span>
                                    <span>{formatCurrency(result.constructionCost)}</span>
                                </div>
                                <div className="pl-3 pr-2 space-y-1.5 text-xs text-slate-500">
                                    <div className="flex justify-between border-b border-slate-50 pb-1">
                                        <span>基礎工事費</span>
                                        <span>{formatCurrency(result.combinedBaseCost)}</span>
                                    </div>
                                    {result.pumpCost > 0 && (
                                        <div className="flex justify-between border-b border-slate-50 pb-1">
                                            <span>増圧ポンプ設置費</span>
                                            <span>{formatCurrency(result.pumpCost)}</span>
                                        </div>
                                    )}
                                    <div className="flex justify-between border-b border-slate-50 pb-1">
                                        <span>申請・撤去費等</span>
                                        <span>{formatCurrency(result.designFee + result.tankRemovalCost + result.elevatedRemovalCost)}</span>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <div className="flex justify-between items-center py-2 px-3 bg-slate-100 rounded-lg font-bold text-slate-700 mb-2">
                                    <span>納付金・手数料等</span>
                                    <span>{formatCurrency(subTotalFees)}</span>
                                </div>
                                <div className="pl-3 pr-2 space-y-2 text-xs text-slate-500">
                                    <div className="flex justify-between items-center border-b border-slate-50 pb-1">
                                        <span className="flex items-center">
                                            基本工事費（施設整備費）
                                            <div className="group relative ml-1">
                                                <Info className="h-3 w-3 text-slate-400 cursor-help" />
                                                <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 w-48 bg-slate-800 text-white text-[10px] p-2 rounded shadow-lg hidden group-hover:block z-10 leading-relaxed font-normal">
                                                    水道局に納める納付金です。口径を太くする場合、新旧口径の差額分が必要です。
                                                </div>
                                            </div>
                                        </span>
                                        <span className={result.differenceCost > 0 ? "font-bold text-slate-700" : ""}>
                                            {formatCurrency(result.differenceCost)}
                                        </span>
                                    </div>
                                    <div className="flex justify-between items-center border-b border-slate-50 pb-1">
                                        <span className="flex items-center">
                                            直接工事（道路工事費）
                                            <div className="group relative ml-1">
                                                <Info className="h-3 w-3 text-slate-400 cursor-help" />
                                                <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 w-56 bg-slate-800 text-white text-[10px] p-2 rounded shadow-lg hidden group-hover:block z-10 leading-relaxed font-normal">
                                                    前面道路の水道本管から取り出す際の工事費です。増径時に発生しますが、受水槽10t以下の場合は特例で免除される事があります。
                                                </div>
                                            </div>
                                        </span>
                                        <span className={result.roadConstructionCost > 0 ? "font-bold text-slate-700" : ""}>
                                            {formatCurrency(result.roadConstructionCost)}
                                        </span>
                                    </div>
                                    <div className="flex justify-between items-center border-b border-slate-50 pb-1">
                                        <span>設計審査手数料</span>
                                        <span>{formatCurrency(result.designCheckFee)}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-4 pt-2 flex flex-wrap gap-2 text-[10px] text-slate-400">
                                <span className="bg-white border border-slate-100 px-2 py-1 rounded">
                                    選定口径: <span className="font-bold text-slate-600">{result.newPipeSize}mm</span>
                                </span>
                                {result.roadCostReason && (
                                    <span className="bg-white border border-slate-100 px-2 py-1 rounded">{result.roadCostReason}</span>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ComparisonTable = ({ simulation, compareWithRenewal, setCompareWithRenewal, renewalYear, setRenewalYear }) => { 
            const { 
                tankData, directData, delayedDirectData,
                tankTotalCost, newTotalCost, delayedTotalCost,
                savings, delayedSavings,
                tankCleaningYearly, tankPumpMaintYearly, newPumpMaintYearly,
                tankPumpReplaceCost, newPumpReplaceCost, tankElecYearly, newElecYearly,
                tankRenewalCost, constructionCostManYen,
                delayedStats,
                renewalCount, renewalYears // 取得
            } = simulation;

            // チェックボックス変更ハンドラ
            const onCheckboxChange = (e) => {
                const checked = e.target.checked;
                setCompareWithRenewal(checked);
                if (checked) {
                    setRenewalYear(0);
                } else {
                    setRenewalYear(20); // デフォルトに戻す
                }
            };

            // スライダー変更ハンドラ
            const onSliderChange = (e) => {
                const val = Number(e.target.value);
                setRenewalYear(val);
                if (val === 0) {
                    setCompareWithRenewal(true);
                } else {
                    setCompareWithRenewal(false);
                }
            };

            // 右側の列のデータを切り替える（チェックボックスの状態に応じて）
            const rightColumnData = compareWithRenewal ? {
                label: "今すぐ直結給水方式",
                total: newTotalCost,
                savings: savings,
                cleaning: 0,
                maintenance: newPumpMaintYearly * 40,
                pumpReplace: newPumpReplaceCost * 2,
                electricity: newElecYearly * 40,
                renewal: 0,
                construction: constructionCostManYen
            } : {
                label: `${renewalYear}年後に直結給水方式`,
                total: delayedTotalCost,
                savings: delayedSavings,
                cleaning: delayedStats.cleaning,
                maintenance: delayedStats.maintenance,
                pumpReplace: delayedStats.pumpReplace,
                electricity: delayedStats.electricity,
                renewal: 0, 
                construction: constructionCostManYen 
            };

            return (
                <div className="bg-white rounded-3xl overflow-hidden border border-slate-200 shadow-sm mt-8">
                    <div className="bg-slate-800 p-6 text-white">
                        <div className="flex justify-between items-center">
                            <div>
                                <h2 className="text-xl md:text-2xl font-bold flex items-center gap-3">
                                    <BarChart3 className="h-6 w-6 text-blue-400" />
                                    今後40年間の維持費シミュレーション
                                </h2>
                                <p className="text-slate-300 text-sm mt-1">
                                    現状維持と直結給水に切り替えた場合のコスト比較
                                </p>
                            </div>
                        </div>
                    </div>

                    <div className="p-6 md:p-8">
                        <div className="flex flex-row gap-2 md:gap-8 items-end md:items-center justify-center mb-10">

                                <div className="text-xs md:text-sm font-bold text-slate-500 mb-2">受水槽方式を維持</div>

                                    <div className="w-full bg-slate-400 rounded-t-xl relative transition-all duration-1000" style={{ height: '100%' }}>
                                        <div className="absolute top-2 left-0 right-0 text-white font-bold text-sm md:text-lg drop-shadow-md">
                                            {Math.round(tankTotalCost).toLocaleString()}万円
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-slate-200 p-3 rounded-b-xl font-black text-slate-700 w-full md:max-w-[200px] mx-auto text-sm md:text-lg leading-tight shadow-md">将来コストが高額</div>
                            </div>

                            <div className="px-1 md:px-0 flex-shrink-0 mb-8 md:mb-0">
                                <ArrowRight className="h-6 w-6 md:h-10 md:w-10 text-slate-300" />
                            </div>

                            {/* 直結給水（動的に切り替え） */}
                            <div className="flex-1 md:w-1/3 text-center">
                                <div className="text-xs md:text-sm font-bold text-blue-600 mb-2">
                                    {compareWithRenewal ? "今すぐ直結給水" : `${renewalYear}年後に直結化`}
                                </div>
                                <div className="h-48 bg-blue-50 rounded-t-xl relative flex items-end justify-center mx-auto w-full md:max-w-[200px]">
                                    <div className="w-full bg-blue-600 rounded-t-xl relative transition-all duration-1000 flex flex-col justify-start pt-2" style={{ height: `${(rightColumnData.total / tankTotalCost) * 100}%` }}>
                                        <div className="text-white font-bold text-sm md:text-lg drop-shadow-md">
                                            {Math.round(rightColumnData.total).toLocaleString()}万円
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-blue-100 p-3 rounded-b-xl font-black text-blue-800 w-full md:max-w-[200px] mx-auto text-sm md:text-lg leading-tight shadow-md">
                                    {Math.round(rightColumnData.savings).toLocaleString()}万円 お得！
                                </div>
                            </div>
                        </div>

                        <div className="mb-6">
                            <div className="flex items-center gap-2 mb-4 text-slate-700">
                                <LineChart className="h-5 w-5 text-blue-600" />
                                <h3 className="font-bold">累計支出推移と損益分岐点</h3>

                            <BreakEvenChart 
                                tankData={tankData} 
                                directData={directData} 
                                delayedDirectData={delayedDirectData} 
                                renewalYear={renewalYear}
                                compareWithRenewal={compareWithRenewal}
                            />
                            
                            <div className="mt-8 space-y-6 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                                <div className="flex justify-center">
                                    <label className="inline-flex items-center gap-3 bg-white border border-blue-200 px-6 py-4 rounded-xl cursor-pointer hover:bg-blue-50 transition-colors shadow-sm">
                                        <input 
                                            type="checkbox"
                                            checked={compareWithRenewal}
                                            onChange={onCheckboxChange}
                                            className="w-6 h-6 text-blue-600 rounded focus:ring-blue-500"
                                        />
                                        <span className="text-sm font-black text-blue-900 leading-tight">
                                            今回受水槽を交換する場合と比較する
                                            <span className="block text-[10px] font-bold text-blue-600 mt-0.5 opacity-80">

                                        </span>
                                    </label>
                                </div>

                                    </label>
                                    <div className="flex items-center gap-6">
                                        <input 
                                            type="range" min="0" max="40" step="1" 
                                            value={renewalYear} onChange={onSliderChange}
                                            className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                        />
                                        <span className="text-lg font-black text-blue-900 w-28 text-right bg-white px-3 py-1 rounded-lg border border-slate-200 whitespace-nowrap">
                                            {renewalYear}年後
                                        </span>
                                    </div>
                                    <p className="text-[10px] text-slate-500 mt-2 text-center">
                                        ※スライダーを動かすと、グラフの<span className="font-bold text-blue-600">青色の実線（{renewalYear}年後に直結化）</span>が変化します。
                                    </p>
                                </div>
                            </div>

                            <p className="text-[10px] text-slate-500 mt-4 text-center">
                                ※工事費(0年目)から始まり、年ごとの維持費・定期メンテナンス費を加算した累計額の推移です。
                            </p>
                        </div>

                        <div className="overflow-x-auto mb-8">
                            <table className="w-full text-xs md:text-sm text-left border-collapse table-fixed">
                                <thead>
                                    <tr className="bg-slate-100 text-slate-700">
                                        <th className="p-3 border border-slate-200 w-auto">項目 (40年間合計)</th>
                                        <th className="p-3 border border-slate-200 text-center w-24 md:w-36">受水槽方式</th>
                                        {/* 幅を拡大: w-24 md:w-32 -> w-32 md:w-60 */}
                                        <th className="p-3 border border-slate-200 text-center w-32 md:w-60 bg-blue-50 text-blue-900">
                                            {rightColumnData.label}
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td className="p-3 border border-slate-200 font-bold">受水槽清掃・水質検査</td>
                                        <td className="p-3 border border-slate-200 text-right">{Math.round(tankCleaningYearly * 40).toLocaleString()}万円</td>
                                        <td className="p-3 border border-slate-200 text-right bg-blue-50 font-bold text-blue-700">{Math.round(rightColumnData.cleaning).toLocaleString()}万円</td>
                                    </tr>
                                    <tr>
                                        <td className="p-3 border border-slate-200 font-bold">ポンプ保守・点検</td>
                                        <td className="p-3 border border-slate-200 text-right">{Math.round(tankPumpMaintYearly * 40).toLocaleString()}万円</td>
                                        <td className="p-3 border border-slate-200 text-right bg-blue-50">{Math.round(rightColumnData.maintenance).toLocaleString()}万円</td>
                                    </tr>
                                    <tr>
                                        <td className="p-3 border border-slate-200 font-bold">ポンプ交換費用</td>
                                        <td className="p-3 border border-slate-200 text-right">{Math.round(tankPumpReplaceCost * 2).toLocaleString()}万円</td>
                                        <td className="p-3 border border-slate-200 text-right bg-blue-50">{Math.round(rightColumnData.pumpReplace).toLocaleString()}万円</td>
                                    </tr>
                                    <tr>
                                        <td className="p-3 border border-slate-200 font-bold">電気代</td>
                                        <td className="p-3 border border-slate-200 text-right">{Math.round(tankElecYearly * 40).toLocaleString()}万円</td>
                                        <td className="p-3 border border-slate-200 text-right bg-blue-50">{Math.round(rightColumnData.electricity).toLocaleString()}万円</td>
                                    </tr>
                                    <tr>
                                        <td className="p-3 border border-slate-200 font-bold text-red-600">
                                            受水槽の更新費用
                                            <div className="text-[10px] font-normal text-slate-500 mt-1">
                                                {renewalCount > 0 ? (
                                                    <React.Fragment>※1回 {Math.round(tankRenewalCost).toLocaleString()}万円 × {renewalCount}回<br/>({renewalYears.join('年目と')}年目に実施)</React.Fragment>
                                                ) : (
                                                    <React.Fragment>※実施なし</React.Fragment>
                                                )}
                                            </div>
                                        </td>
                                        <td className="p-3 border border-slate-200 text-right font-bold text-red-600 text-lg">
                                            {Math.round(tankRenewalCost * renewalCount).toLocaleString()}万円
                                        </td>
                                        <td className="p-3 border border-slate-200 text-right bg-blue-50 font-bold text-blue-700">0万円</td>
                                    </tr>
                                    <tr className="bg-yellow-50">
                                        <td className="p-3 border border-yellow-100 font-bold text-yellow-800">今回の工事費用＋納付金</td>
                                        <td className="p-3 border border-yellow-100 text-right text-slate-400">-</td>
                                        <td className="p-3 border border-yellow-100 text-right font-bold text-blue-900">{Math.round(rightColumnData.construction).toLocaleString()}万円</td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr className="border-t-4 border-white shadow-xl relative z-10">
                                        <td className="p-4 bg-slate-900 text-white font-bold align-middle">
                                            <div className="text-xs text-slate-400 font-normal mb-1">維持・更新費の総額</div>
                                            <div className="text-lg md:text-xl">40年間合計コスト</div>
                                        </td>
                                        <td className="p-4 bg-slate-100 text-slate-500 text-right font-bold align-middle border-r border-slate-200 relative">
                                            <div className="text-sm md:text-base">{Math.round(tankTotalCost).toLocaleString()}<span className="text-xs ml-0.5">万円</span></div>
                                        </td>
                                        <td className="p-4 bg-blue-600 text-white text-right font-bold align-middle relative overflow-hidden border-r border-blue-500">
                                            <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-blue-500 to-blue-700"></div>
                                            <div className="absolute top-0 left-0 w-full h-1 bg-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.5)]"></div>
                                            <div className="relative z-10 flex flex-col items-center">
                                                 <div className="mb-2">
                                                    <div className="bg-yellow-400 text-blue-900 px-6 py-1 rounded-full font-black shadow-sm transform scale-105 text-center whitespace-nowrap">
                                                        <span className="text-sm md:text-base mr-1">{Math.round(rightColumnData.savings).toLocaleString()}万円</span>
                                                        <span className="text-xs md:text-sm">お得！</span>
                                                    </div>
                                                 </div>
                                                <div className="text-2xl md:text-4xl font-black drop-shadow-md tracking-tight leading-none">
                                                    {Math.round(rightColumnData.total).toLocaleString()}<span className="text-sm md:text-lg font-bold ml-0.5">万円</span>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const EstimateCalculator = () => {
            const [floors, setFloors] = useState(4); 
            const [units, setUnits] = useState(10);
            const [useBoosterPump, setUseBoosterPump] = useState(true);
            const [hasTankRemoval, setHasTankRemoval] = useState(true);
            const [hasElevatedTankRemoval, setHasElevatedTankRemoval] = useState(false);
            const [currentPipeSize, setCurrentPipeSize] = useState(40);
            const [tankCapacity, setTankCapacity] = useState(10); 
            
            const [compareWithRenewal, setCompareWithRenewal] = useState(false); 
            const [renewalYear, setRenewalYear] = useState(20); 

            const [result, setResult] = useState(calculateEstimateValue(4, 10, true, false, 40, 10, true));

            useEffect(() => {
                if (floors === 3) setUseBoosterPump(false);
                else if (floors === 4 || floors === 5) setUseBoosterPump(true);
            }, [floors]);

            useEffect(() => {
                 const res = calculateEstimateValue(floors, units, hasTankRemoval, hasElevatedTankRemoval, currentPipeSize, tankCapacity, useBoosterPump);
                 setResult(res);
            }, [floors, units, hasTankRemoval, hasElevatedTankRemoval, currentPipeSize, tankCapacity, useBoosterPump]);

            const handleCalculate = () => {
                 const res = calculateEstimateValue(floors, units, hasTankRemoval, hasElevatedTankRemoval, currentPipeSize, tankCapacity, useBoosterPump);
                 setResult(res);
            };

            const simulation = calculateSimulationData(units, tankCapacity, result.isBooster ? 'booster' : 'direct', result.total, compareWithRenewal, renewalYear);
            const formatCurrency = (num) => new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(num);

            const inputProps = { floors, setFloors, units, setUnits, useBoosterPump, setUseBoosterPump, currentPipeSize, setCurrentPipeSize, tankCapacity, setTankCapacity, hasTankRemoval, setHasTankRemoval, hasElevatedTankRemoval, setHasElevatedTankRemoval, handleCalculate };

            return (
                <section id="calculator" className="py-20 bg-slate-50">
                    <div className="container mx-auto px-4">
                        <div className="text-center mb-12">
                            <h2 className="text-2xl md:text-4xl font-bold text-slate-900 mb-4 inline-flex items-center gap-3 text-left md:text-center">
                                <Calculator className="h-8 w-8 md:h-10 md:w-10 text-blue-600 flex-shrink-0" />
                                <span className="leading-tight">直結切替工事 <br className="md:hidden" />概算シミュレーター</span>
                            </h2>
                            <p className="text-slate-600 max-w-2xl mx-auto">
                                建物の情報を入力するだけで、工事費用と納付金の目安がわかります。<br className="hidden sm:block" />
                                現在の維持費との比較シミュレーションも可能です。
                            </p>
                        </div>

                        <div className="max-w-5xl mx-auto space-y-8">
                            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                                <div className="flex flex-col md:flex-row md:items-center justify-between mb-6 pb-4 border-b border-slate-100 gap-4">
                                    <div className="flex items-center gap-4">
                                        <div className="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-100 flex-shrink-0">1</div>
                                        <div>
                                            <h3 className="text-xl font-bold text-slate-800">条件入力</h3>
                                            <p className="text-xs text-slate-500">建物の規模や現在の設備状況を入力してください</p>
                                        </div>
                                    </div>
                                    <div className="text-xs font-bold text-red-600 bg-red-50 px-3 py-1 rounded-full self-start md:self-auto">
                                        ※条件を変更するとリアルタイムで再計算されます
                                    </div>
                                </div>
                                <InputFormSection {...inputProps} />
                            </div>

                            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                                <div className="flex items-center gap-4 mb-6">
                                    <div className="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-100 flex-shrink-0">2</div>
                                    <h3 className="text-xl font-bold text-slate-800">削減コストを確認する</h3>
                                </div>
                                <SavingsSection savings={simulation.savings} />
                            </div>

                            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                                <div className="flex items-center gap-4 mb-6">
                                    <div className="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-100 flex-shrink-0">3</div>
                                    <h3 className="text-xl font-bold text-slate-800">工事費用見積金額</h3>
                                </div>
                                <ResultSection result={result} formatCurrency={formatCurrency} />
                            </div>
                        </div>

                        <div id="simulation-graph" className="max-w-5xl mx-auto mt-16 pt-8 border-t border-slate-200">
                            <ComparisonTable 
                                simulation={simulation} 
                                compareWithRenewal={compareWithRenewal}
                                setCompareWithRenewal={setCompareWithRenewal}
                                renewalYear={renewalYear}
                                setRenewalYear={setRenewalYear}
                            />
                        </div>
                    </div>
                </section>
            );
        };

        const ProcessFlow = () => {
            const steps = [
                { 
                    title: "お問い合わせ・相談", 
                    desc: "まずはお電話またはフォームよりご連絡ください。建物の図面があればスムーズです。" 
                },
                { 
                    title: "現地調査・情報収集", 
                    desc: <React.Fragment>専門スタッフがお伺いし、配管ルートや水圧調査、設置場所の確認を行います。（無料）<br />また、必要な場合は、管轄の水道局と直結化が可能どうか事前協議も行います。</React.Fragment>
                },
                { 
                    title: "お見積り・ご契約", 
                    desc: "調査と協議結果に基づき、正確な工事費用をご提示します。" 
                },
                { 
                    title: "申請", 
                    desc: "名古屋市上下水道局への給水装置工事の申請手続きを行います。弊社で申請を行うため、スムーズな申請が可能です。" 
                },
                { 
                    title: "本工事・切替", 
                    desc: "断水時間を最小限に抑え、配管の接続工事とポンプ設置（必要な場合）を行います。" 
                },
                { 
                    title: "受水槽撤去", 
                    desc: "切り替え完了後、不要になった受水槽を解体・撤去し、整地します。" 
                },
            ];

            return (
                <section id="flow" className="py-20 bg-slate-50">
                    <div className="container mx-auto px-4">
                        <h2 className="text-3xl font-bold text-center text-slate-900 mb-16">
                            工事完了までの流れ
                        </h2>
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {steps.map((step, index) => (
                                <div key={index} className="relative group">
                                    <div className="bg-white p-6 rounded-xl border border-slate-100 h-full hover:border-blue-200 transition-colors shadow-sm">
                                        <div className="absolute -top-4 -left-4 w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-lg shadow-md group-hover:scale-110 transition-transform">
                                            {index + 1}
                                        </div>
                                        <h3 className="text-lg font-bold mt-2 mb-3 text-slate-900">
                                            {step.title}
                                        </h3>
                                        <p className="text-slate-600 text-sm leading-relaxed">
                                            {step.desc}
                                        </p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const FAQ = () => {
            const [openIndex, setOpenIndex] = useState(0);
            
            const faqs = [
                { q: "断水時間はどれくらいですか？", a: "建物の規模によりますが、配管の切り替え接続を行う数時間程度で済むケースがほとんどです。工事の大部分は断水なしで行います。" },
                { q: "水圧が弱くなることはありませんか？", a: "事前に水道局と協議し、十分な水圧が確保できるか調査します。3階建て以上など水圧不足が懸念される場合は、増圧ポンプを設置することで快適な水圧を確保します。" },
                { q: "すべての建物で直結化できますか？", a: "前面道路の水道本管の口径や水圧、建物の配管状況によっては直結化できない場合があります。まずは無料の現地調査をご利用ください。" },
            ];

            return (
                <section className="py-20 bg-white">
                    <div className="container mx-auto px-4 max-w-3xl">
                        <h2 className="text-3xl font-bold text-center text-slate-900 mb-12">
                            よくあるご質問
                        </h2>
                        <div className="space-y-4">
                            {faqs.map((item, i) => (
                                <div key={i} className="bg-slate-50 rounded-lg shadow-sm overflow-hidden border border-slate-100">
                                    <button 
                                        onClick={() => setOpenIndex(openIndex === i ? null : i)}
                                        className="w-full flex items-center justify-between p-5 text-left font-bold text-slate-800 focus:outline-none hover:bg-slate-100 transition-colors"
                                    >
                                        <span className="flex items-center gap-3">
                                            <span className="text-blue-600">Q.</span>
                                            {item.q}
                                        </span>
                                        {openIndex === i ? <ChevronUp className="h-5 w-5 text-slate-400" /> : <ChevronDown className="h-5 w-5 text-slate-400" />}
                                    </button>
                                    {openIndex === i && (
                                        <div className="p-5 pt-0 text-slate-600 border-t border-slate-100 bg-slate-50">
                                            <span className="font-bold text-blue-600 mr-2">A.</span>
                                            {item.a}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = () => (
            <section id="contact" className="py-20 bg-blue-900 text-white">
                <div className="container mx-auto px-4 text-center">
                    <h2 className="text-3xl font-bold mb-6">
                        無料現地調査・お見積り依頼
                    </h2>
                    <div className="text-blue-200 mb-10 max-w-2xl mx-auto">
                        <p>
                            受水槽のメンテナンスにお悩みの方、コスト削減をご検討の方はお気軽にご相談ください。しつこい営業は一切いたしません。
                        </p>
                    </div>
                    
                    <div className="flex flex-col md:flex-row justify-center items-center gap-6 max-w-4xl mx-auto">
                        <a href="tel:052-853-2717" className="flex items-center justify-center gap-3 bg-white text-blue-900 w-full py-6 rounded-xl shadow-lg hover:bg-slate-100 transition-colors group">
                            <Phone className="h-8 w-8 text-blue-600 group-hover:scale-110 transition-transform" />
                            <div className="text-left">
                                <div className="text-xs text-slate-500 font-bold">お電話でのご相談</div>
                                <div className="text-3xl font-black tracking-wider">
                                    052-853-2717
                                </div>
                            </div>
                        </a>
                        
                        <a href="https://line.me/R/ti/p/@780zsckj" target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-3 bg-[#06C755] text-white w-full py-6 rounded-xl shadow-lg hover:bg-[#05b64d] transition-colors group">
                            <MessageCircle className="h-8 w-8 text-white group-hover:scale-110 transition-transform" />
                            <div className="text-left">
                                <div className="text-xs text-white/80 font-bold">LINEで気軽に</div>
                                <div className="text-2xl font-bold">お問い合わせ</div>
                            </div>
                        </a>

                        <a href="https://www.e-fujico.com/contact/" target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-3 bg-blue-700 text-white w-full py-6 rounded-xl border border-blue-500 hover:bg-blue-600 transition-colors">
                            <Mail className="h-8 w-8" />
                            <div className="text-left">
                                <div className="text-xs text-blue-200 font-bold">Webフォームから</div>
                                <div className="text-2xl font-bold">お問い合わせ</div>
                            </div>
                        </a>
                    </div>
                    <p className="mt-6 text-sm text-blue-300">受付時間 9:00〜17:00（土日祝除く）</p>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800">
                <div className="container mx-auto px-4">
                    <div className="grid md:grid-cols-4 gap-8 mb-8">
                        <div className="col-span-1 md:col-span-2">
                            <div className="flex items-center gap-3 mb-4 text-white">
                                {/* フッター用ロゴ（白抜きまたはそのまま表示） */}
                                <img 
                                    src="フジコー_ロゴ　背景透過.jpg" 
                                    alt="株式会社フジコー ロゴ" 
                                    className="h-10 w-auto bg-white rounded p-1"
                                    onError={(e) => e.target.style.display = 'none'} 
                                />
                                <span className="text-xl font-bold">株式会社フジコー</span>
                            </div>
                            <p className="text-sm leading-relaxed mb-4">
                                愛知県のビル・マンションの給水方式変更工事（直結給水切替工事）の施工実績多数。東海エリア全域対応、水道局指定の工事店としての確かな技術で、安心・安全な水をお届けします。
                            </p>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4">メニュー</h4>
                            <ul className="space-y-2 text-sm">
                                <li><a href="#" className="hover:text-white">トップページ</a></li>
                                <li><a href="#calculator" className="hover:text-white">概算見積シミュレーション</a></li>
                                <li><a href="#features" className="hover:text-white">メリット</a></li>
                                <li><a href="#flow" className="hover:text-white">工事の流れ</a></li>
                                <li><a href="#contact" className="hover:text-white">お問い合わせ</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4">会社情報</h4>
                            <ul className="space-y-2 text-sm">
                                <li>
                                    <a href="https://www.e-fujico.com/company/" target="_blank" rel="noopener noreferrer" className="hover:text-white transition-colors">
                                        会社概要
                                    </a>
                                </li>
                                <li>
                                    <a href="https://www.e-fujico.com/privacypolicy/" target="_blank" rel="noopener noreferrer" className="hover:text-white transition-colors">
                                        プライバシーポリシー
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div className="text-center text-xs text-slate-600 pt-8 border-t border-slate-800">
                        &copy; 2024 Fujiko Co., Ltd. All Rights Reserved.
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            return (
                <div className="min-h-screen relative">
                    <Header />
                    <Hero />
                    <EstimateCalculator />
                    <Features />
                    <ProcessFlow />
                    <FAQ />
                    <Contact />
                    <Footer />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
